name: Code and synthetic tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - run: python scripts/check_repository.py
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: npm test
      - run: node --check app/static/app.js && node --check app/static/theme.js
